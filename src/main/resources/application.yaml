server:
  port: 8080

spring:
  profiles:
    active: dev
  
  application:
    name: event-ticketing-system
  
  datasource:
    url: jdbc:postgresql://localhost:5432/event_ticketing
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

#Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ========================
# 🔐 JWT CONFIG
# ========================
jwt:
  secret: your-super-secure-ticketing-secret-key
  expiration: 86400000   # 24h

# ========================
# 🌐 CORS (VERY IMPORTANT)
# ========================
cors:
  allowed-origins:
    - http://localhost:3000   # Next.js dev
    - https://yourdomain.com

# ========================
# 🎟 TICKETING CONFIG
# ========================
ticketing:
  booking:
    reservation-timeout-minutes: 15   # hold ticket before payment
    max-tickets-per-user: 10

  event:
    default-timezone: Asia/Bangkok

# ========================
# 💳 PAYMENT (Future Ready)
# ========================
payment:
  provider: mock   # stripe / omise / paypal later
  currency: THB

# ========================
# 📩 NOTIFICATION (Future)
# ========================
notification:
  email:
    enabled: false
  sms:
    enabled: false

# ========================
# 📊 LOGGING
# ========================
logging:
  level:
    root: INFO
    "[org.springframework.security]": DEBUG
    "[org.springframework.web]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    