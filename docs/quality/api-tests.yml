name: API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
          POSTGRES_DB: event_ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Install HTTPie
      run: |
        python -m pip install --upgrade pip
        pip install httpie
    
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
    
    - name: Run application
      run: |
        ./mvnw spring-boot:run &
        APP_PID=$!
        echo "Application PID: $APP_PID"
        
        # Wait for application to start
        echo "Waiting for application to start..."
        for i in {1..30}; do
          if curl -s http://localhost:8080/actuator/health > /dev/null; then
            echo "Application is ready!"
            break
          fi
          echo "Attempt $i/30: Application not ready yet..."
          sleep 2
        done
        
        # Store PID for cleanup
        echo $APP_PID > app.pid
    
    - name: Run API tests
      run: |
        chmod +x pipeline-tests/run-tests.sh
        ./pipeline-tests/run-tests.sh
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: api-test-results
        path: |
          pipeline-tests/reports/
          !pipeline-tests/reports/*.tmp
    
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: API Tests
        path: pipeline-tests/reports/test-results.json
        reporter: json
    
    - name: Stop application
      if: always()
      run: |
        if [ -f app.pid ]; then
          kill $(cat app.pid) || true
          rm app.pid
        fi
    
    - name: Coverage report
      run: |
        echo "## API Coverage Report" >> $GITHUB_STEP_SUMMARY
        cat pipeline-tests/reports/coverage.json | jq -r '.coverage' | xargs -I {} echo "- Coverage: {}%" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Tested Endpoints" >> $GITHUB_STEP_SUMMARY
        cat pipeline-tests/reports/coverage.json | jq -r '.endpoints[] | "- \(.method) \(.path)"' >> $GITHUB_STEP_SUMMARY
