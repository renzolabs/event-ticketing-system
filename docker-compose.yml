version: "3.9"

services:

  # ========================
  # 🗄 PostgreSQL Database
  # ========================
  postgres:
    image: postgres:17
    container_name: ets-postgres
    restart: always
    environment:
      POSTGRES_DB: event_ticketing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ets-network

  # ========================
  # ⚡ Redis (Cache / Queue)
  # ========================
  redis:
    image: redis:7
    container_name: ets-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ets-network

  # ========================
  # 🧰 pgAdmin (Optional UI)
  # ========================
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: ets-pgadmin
  #   restart: always
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@ets.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - ets-network

volumes:
  postgres_data:

networks:
  ets-network:
    driver: bridge